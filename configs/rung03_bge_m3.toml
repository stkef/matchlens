name = "rung03_bge_m3"
rung = 3
description = "Comparison: dense title embeddings alone, BAAI/bge-m3 (568M params, 1024-d)"

[data]
csv = "C:/data/shopee/train.csv"  # kept outside OneDrive; change to wherever you downloaded it
split = "data/splits/split_v1.csv"

[retriever]
type = "dense"
# Computed on Kaggle's GPU by kaggle/embed_titles; see docs/kaggle.md.
path = "C:/data/shopee/embeddings/emb_bge_m3.npz"

[retriever.store]
# Text vectors live in FAISS (exact flat index; saved to disk and reused). Images use Qdrant (rung 4).
type = "faiss"
index = "flat"
path = "C:/data/shopee/stores/faiss_text_bge_m3.index"

[eval]
k = 50
# Other products added to the candidate pool (retrievable, never queried). See docs/evaluation.md.
distractors = ["train"]
latency_sample = 200

[cost]
usd_per_hour = 0.10
