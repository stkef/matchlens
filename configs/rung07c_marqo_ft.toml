name = "rung07c_marqo_ft"
rung = "7c"
description = "Marqo e-commerce B fine-tuned on fold-A products, image embeddings alone"

[data]
csv = "C:/data/shopee/train.csv"  # kept outside OneDrive; change to wherever you downloaded it
split = "data/splits/split_v1.csv"

[retriever]
type = "dense"
# Fine-tuned on fold A and embedded on Kaggle by kaggle/finetune_image; see docs/kaggle.md.
path = "C:/data/shopee/embeddings/emb_img_marqo_ft.npz"

[retriever.store]
# Models are compared in FAISS (exact, fast; identical results to Qdrant, see docs/architecture.md).
# The winning image model is then served from Qdrant: configs/rung04_image_qdrant.toml.
type = "faiss"
index = "flat"
path = "C:/data/shopee/stores/faiss_img_marqo_ft.index"

[eval]
k = 50
# Other products added to the candidate pool (retrievable, never queried). See docs/evaluation.md.
distractors = ["train"]
latency_sample = 200

[cost]
usd_per_hour = 0.10
