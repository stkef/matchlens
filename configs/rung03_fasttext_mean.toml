name = "rung03_fasttext_mean"
rung = 3
description = "Comparison: FastText trained on train-split titles (CPU, ~1 min), fasttext_mean pooling"

[data]
csv = "C:/data/shopee/train.csv"  # kept outside OneDrive; change to wherever you downloaded it
split = "data/splits/split_v1.csv"

[retriever]
type = "dense"
# Trained locally: python -m matchlens.fasttext_embed
path = "C:/data/shopee/embeddings/emb_fasttext_mean.npz"

[retriever.store]
# Text vectors live in FAISS (exact flat index; saved to disk and reused). Images use Qdrant (rung 4).
type = "faiss"
index = "flat"
path = "C:/data/shopee/stores/faiss_text_fasttext_mean.index"

[eval]
k = 50
# Other products added to the candidate pool (retrievable, never queried). See docs/evaluation.md.
distractors = ["train"]
latency_sample = 200

[cost]
usd_per_hour = 0.10
