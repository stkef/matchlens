name = "rung02_phash"
rung = 2
description = "Rung 1b + near-duplicate photos: phash within 6 bits counts as a certain match"

[data]
csv = "C:/data/shopee/train.csv"  # kept outside OneDrive; change to wherever you downloaded it
split = "data/splits/split_v1.csv"

[retriever]
type = "phash_boost"
# Swept on val: 0 -> F1 0.721, 2 -> 0.735, 4 -> 0.740, 6 -> 0.744, 8 -> 0.741.
max_dist = 6

[retriever.base]
type = "bm25"
k1 = 1.2
b = 0.75
canonical_units = true

[eval]
k = 50
# Other products added to the candidate pool (retrievable, never queried). See docs/evaluation.md.
distractors = ["train"]
latency_sample = 200

[cost]
usd_per_hour = 0.10
